services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: bp-mssql
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${BP_MSSQL_PASSWORD:?set BP_MSSQL_PASSWORD in .env}
      MSSQL_PID: Developer
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: bp-mssql-init
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      BP_MSSQL_DATABASE: ${BP_MSSQL_DATABASE:-bp2021_t1}
      MSSQL_SA_PASSWORD: ${BP_MSSQL_PASSWORD:?set BP_MSSQL_PASSWORD in .env}
    entrypoint:
      - /bin/bash
      - -c
      - >
        /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C
        -Q "IF DB_ID('$$BP_MSSQL_DATABASE') IS NULL CREATE DATABASE [$$BP_MSSQL_DATABASE];"
    restart: "no"

volumes:
  mssql_data:
